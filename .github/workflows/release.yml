name: Release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run dist

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "Dynatrace-Answers-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($installer.FullName).sha256" -Value $hash -NoNewline -Encoding ascii

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Dynatrace-Answers-Setup-*.exe
            dist/Dynatrace-Answers-Setup-*.exe.sha256
